name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: '1'

# -----------------------------------------------------------------------------
# These jobs run on PRs only and add rich feedback:
#   - Inline lint annotations on the PR diff (reviewdog)
#   - Coverage table as a PR comment
#
# The CI workflow (ci.yml) runs the full verify in parallel from the push
# event -- these jobs are supplementary feedback, not the pass/fail gate.
# -----------------------------------------------------------------------------

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # -- golangci-lint annotations --------------------------------------------

  go-review:
    name: Go Lint Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          workdir: services/worker
          golangci_lint_flags: '--timeout=5m'
          go_version: '1.24'
          fail_level: error

  # -- Ruff annotations -----------------------------------------------------

  ruff-review:
    name: Python Lint Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          cd services/python
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - uses: reviewdog/action-setup@v1
      - name: Ruff via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd services/python
          .venv/bin/ruff check --output-format=rdjson . \
            | reviewdog -f=rdjson -reporter=github-pr-review -fail-level=error

  # -- Coverage PR comment --------------------------------------------------

  coverage-comment:
    name: Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: apps/web/coverage/coverage-summary.json
          json-final-path: apps/web/coverage/coverage-final.json
          vite-config-path: apps/web/vitest.config.ts
