name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: '1'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  # Dummy values for Next.js build — env validation is skipped but
  # static generation still imports the env module
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  BETTER_AUTH_SECRET: 'ci-placeholder-secret-that-is-at-least-32-chars-long'
  BETTER_AUTH_URL: 'http://localhost:3000'
  NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

jobs:
  verify:
    name: Full Stack Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/worker/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          cd services/python
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Full stack verify
        run: pnpm verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/web/coverage/
          retention-days: 30

      - name: Update coverage baseline (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          npx tsx scripts/coverage-ratchet.ts --update
          cd services/worker && ./scripts/coverage-ratchet.sh --update && cd ../..
          cd services/python && .venv/bin/python3 scripts/coverage_ratchet.py --update && cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .coverage-baseline.json services/worker/.coverage-baseline.json services/python/.coverage-baseline.json
          git diff --cached --quiet || git commit -m "chore: update coverage baseline [skip ci]"
          git push

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          SKIP_ENV_VALIDATION: '1'
